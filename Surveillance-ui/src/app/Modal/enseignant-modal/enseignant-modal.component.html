<div
  class="fixed inset-0 bg-gray-800 bg-opacity-50 flex justify-center items-center z-50"
  *ngIf="true"
>
  <div
    class="bg-white rounded-lg shadow-lg w-full max-w-2xl flex flex-col"
  >
    <!-- Modal Header -->
    <div class="p-4 border-b">
      <h2 class="text-2xl font-semibold text-center">
        Ajouter un Enseignant
      </h2>
    </div>

    <!-- Modal Body -->
    <div class="flex-1 overflow-auto p-6">
      <form (submit)="onSubmit()">
        <!-- Row 1: Nom and Prénom -->
        <div class="grid grid-cols-2 gap-4 mb-4">
          <div>
            <label
              class="block text-sm font-medium text-gray-700"
              for="nom"
            >
              Nom
            </label>
            <input
              id="nom"
              class="w-full p-2 mt-1 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500"
              type="text"
              [(ngModel)]="enseignant.nom"
              name="nom"
              required
            />
          </div>
          <div>
            <label
              class="block text-sm font-medium text-gray-700"
              for="prenom"
            >
              Prénom
            </label>
            <input
              id="prenom"
              class="w-full p-2 mt-1 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500"
              type="text"
              [(ngModel)]="enseignant.prenom"
              name="prenom"
              required
            />
          </div>
        </div>

        <!-- Row 2: CIN and Email -->
        <div class="grid grid-cols-2 gap-4 mb-4">
          <div>
            <label
              class="block text-sm font-medium text-gray-700"
              for="cin"
            >
              CIN
            </label>
            <input
              id="cin"
              class="w-full p-2 mt-1 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500"
              type="text"
              [(ngModel)]="enseignant.cin"
              name="cin"
              required
            />
          </div>
          <div>
            <label
              class="block text-sm font-medium text-gray-700"
              for="email"
            >
              Email
            </label>
            <input
              id="email"
              class="w-full p-2 mt-1 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500"
              type="email"
              [(ngModel)]="enseignant.email"
              name="email"
              required
            />
          </div>
        </div>

        <!-- Row 3: Numéro de Téléphone and Grade -->
        <div class="grid grid-cols-2 gap-4 mb-4">
          <div>
            <label
              class="block text-sm font-medium text-gray-700"
              for="numeroTelephone"
            >
              Numéro de Téléphone
            </label>
            <input
              id="numeroTelephone"
              class="w-full p-2 mt-1 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500"
              type="text"
              [(ngModel)]="enseignant.numeroTelephone"
              name="numeroTelephone"
              required
            />
          </div>
          <div>
            <label
              class="block text-sm font-medium text-gray-700"
              for="grade"
            >
              Grade
            </label>
            <input
              id="grade"
              class="w-full p-2 mt-1 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500"
              type="text"
              [(ngModel)]="enseignant.grade"
              name="grade"
              required
            />
          </div>
        </div>

        <!-- Row 4: Heures Max and Etablissement -->
        <div class="grid grid-cols-2 gap-4 mb-4">
          <div>
            <label
              class="block text-sm font-medium text-gray-700"
              for="nbHeureSurveillanceMaximale"
            >
              Heures Max Surveillance
            </label>
            <input
              id="nbHeureSurveillanceMaximale"
              class="w-full p-2 mt-1 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500"
              type="number"
              [(ngModel)]="enseignant.nbHeureSurveillanceMaximale"
              name="nbHeureSurveillanceMaximale"
              required
            />
          </div>
          <div>
            <label
              class="block text-sm font-medium text-gray-700"
              for="etablissement"
            >
              Etablissement
            </label>
            <select
              id="etablissement"
              class="w-full p-2 mt-1 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500"
              [(ngModel)]="enseignant.departement.etablissement"
              name="etablissement"
              required
            >
              <option value="" disabled selected>
                Sélectionner un établissement
              </option>
              <option
                *ngFor="let etab of etablissements"
                [value]="etab.nom"
              >
                {{ etab.nom }}
              </option>
            </select>
          </div>
        </div>

        <!-- Row 5: Département -->
        <div class="mb-4">
          <label
            class="block text-sm font-medium text-gray-700"
            for="departement"
          >
            Département
          </label>
          <select
            id="departement"
            class="w-full p-2 mt-1 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500"
            [(ngModel)]="enseignant.departement"
            name="departement"
            required
          >
            <option value="" disabled selected>
              Sélectionner un département
            </option>
            <option
              *ngFor="let departement of departements"
              [value]="departement.nom"
            >
              {{ departement.nom }}
            </option>
          </select>
        </div>
      </form>
    </div>

    <!-- Modal Footer -->
    <div class="p-4 border-t bg-gray-50 flex justify-between">
      <button
        type="submit"
        class="px-4 py-2 bg-[#0EA5E9] text-white rounded-lg shadow-md hover:bg-[#0d94c6] focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-[#0EA5E9]"
      >
        Ajouter
      </button>
      <button
        type="button"
        class="px-4 py-2 bg-gray-300 text-gray-700 font-medium rounded-md hover:bg-gray-400 focus:outline-none focus:ring-2 focus:ring-indigo-500"
        (click)="onClose()"
      >
        Annuler
      </button>
    </div>
  </div>
</div>
